<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Exam Seating & Attendance Automation</title>
<style>
:root {
  --bg: #f3efe6;
  --ink: #231f1a;
  --maroon: #7a1f2b;
  --maroon-dark: #621822;
  --green: #39562f;
  --green-dark: #2c4324;
  --line: #d8cfba;
  --muted: #6b6255;
  --card: #ffffffa0;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: Georgia, "Times New Roman", serif; }
.topbar { background: #1c1712; color: var(--bg); border-bottom: 4px solid var(--maroon); padding: 14px 24px; }
.brand { font-size: 18px; display: flex; align-items: center; gap: 10px; }
.mark { width: 30px; height: 30px; background: var(--maroon); display: inline-flex; align-items: center; justify-content: center; border-radius: 3px; font-weight: bold; }
.layout { max-width: 1100px; margin: 0 auto; padding: 32px 24px; display: grid; grid-template-columns: 320px 1fr; gap: 32px; }
@media (max-width: 800px) { .layout { grid-template-columns: 1fr; } }
.card, .dropzone { background: var(--card); border-radius: 8px; padding: 18px; margin-bottom: 20px; }
.dropzone { border: 2px dashed rgba(122,31,43,.4); text-align: center; }
.dropzone.dragover { border-color: var(--maroon); background: #fff; }
.hint { font-size: 12px; color: var(--muted); margin: 4px 0 12px; font-family: sans-serif; }
button { font-family: sans-serif; cursor: pointer; border: none; border-radius: 6px; }
#chooseBtn { background: var(--maroon); color: #fff; padding: 9px 16px; font-size: 14px; font-weight: 600; }
#chooseBtn:hover { background: var(--maroon-dark); }
.status { margin-top: 10px; font-size: 12px; font-family: sans-serif; padding: 6px 8px; border-radius: 4px; text-align: left; }
.status.ok { background: #e4ecdf; color: #39562f; }
.status.err { background: #f4dede; color: #7a1f2b; }
h3 { font-size: 13px; letter-spacing: .05em; color: var(--maroon); margin: 0 0 12px; text-transform: uppercase; }
.field { display: block; margin-bottom: 10px; }
.field span { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-family: sans-serif; margin-bottom: 4px; }
.field input { width: 100%; padding: 7px 8px; border: 1px solid var(--line); border-radius: 4px; font-size: 13px; font-family: sans-serif; }
.stat { background: #1c1712; color: var(--bg); display: flex; align-items: center; gap: 10px; }
.stat-num { font-size: 22px; }
.stat-label { font-size: 11px; text-transform: uppercase; color: #c9b79c; font-family: sans-serif; }
.actions { display: flex; flex-direction: column; gap: 8px; }
.btn { padding: 11px; font-size: 13px; font-weight: 600; color: #fff; font-family: sans-serif; }
.btn.green { background: var(--green); }
.btn.green:hover { background: var(--green-dark); }
.btn.red { background: var(--maroon); }
.btn.red:hover { background: var(--maroon-dark); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.firebase-note { font-size: 11px; color: var(--muted); font-family: sans-serif; margin-top: 10px; line-height: 1.4; }
.tabs { display: flex; gap: 4px; margin-bottom: 12px; font-family: sans-serif; }
.tab { background: transparent; color: var(--muted); padding: 8px 16px; font-size: 13px; font-weight: 600; border-radius: 6px 6px 0 0; }
.tab.active { background: #fff; color: var(--maroon); }
.preview-body { background: #fff; border-radius: 6px; padding: 28px; min-height: 500px; box-shadow: 0 1px 2px rgba(0,0,0,.06); overflow-x: auto; }
.empty { text-align: center; color: #9a8f7a; padding: 100px 0; border: 1px dashed var(--line); border-radius: 6px; font-family: sans-serif; font-size: 13px; }
.doc-title { text-align: center; font-weight: bold; font-size: 17px; }
.doc-sub { text-align: center; margin-top: 4px; }
table.sheet { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 14px; }
table.sheet th, table.sheet td { border: 1px solid var(--line); padding: 5px 7px; text-align: center; white-space: nowrap; }
table.sheet th { background: #efe8d8; }
table.sheet td.left { text-align: left; }

@media print {
  body * { visibility: hidden; }
  #previewBody, #previewBody * { visibility: visible; }
  #previewBody { position: absolute; top: 0; left: 0; width: 100%; box-shadow: none; }
  .topbar, .panel, .tabs { display: none !important; }
}

</style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="mark">S</span> Seating &amp; Attendance Automation</div>
  </header>

  <main class="layout">
    <section class="panel">
      <div class="dropzone" id="dropzone">
        <p><strong>Drop attendance sheet .docx</strong></p>
        <p class="hint">Sl.No / Register Number / Name table required</p>
        <button id="chooseBtn" type="button">Choose File</button>
        <input type="file" id="fileInput" accept=".docx" hidden />
        <div id="fileStatus" class="status"></div>
      </div>

      <div class="card">
        <h3>Sheet Details</h3>
        <div id="fields"></div>
        <label class="field">
          <span>Rows per Column (seat block)</span>
          <input id="rowsPerCol" type="number" value="7" min="1" max="20" />
        </label>
      </div>

      <div class="card stat">
        <div>
          <div class="stat-num" id="studentCount">0</div>
          <div class="stat-label">Students loaded</div>
        </div>
      </div>

      <div class="actions">
        <button id="exportAttendance" class="btn green" disabled type="button">Export Attendance (.xlsx)</button>
        <button id="exportSeatingXlsx" class="btn green" disabled type="button">Export Seating Plan (.xlsx)</button>
        <button id="exportSeatingPdf" class="btn red" disabled type="button">Export Seating Plan (.pdf)</button>
      </div>

      <p class="firebase-note" id="firebaseNote"></p>
    </section>

    <section class="preview">
      <div class="tabs">
        <button id="tabRoster" class="tab active" type="button">Attendance Sheet</button>
        <button id="tabSeating" class="tab" type="button">Seating Plan</button>
      </div>
      <div id="previewBody" class="preview-body">
        <p class="empty">Upload an attendance .docx on the left to generate a preview.</p>
      </div>
    </section>
  </main>

  <!-- Document / spreadsheet / PDF libraries (all client-side, no backend needed) -->
  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.7.2/mammoth.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

  <!-- Firebase (optional archiving of generated files — see firebase-config in script.js) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

<script>
/* =================================================================
   FIREBASE (optional) — archives every generated file to Storage and
   logs it in Firestore. This is a static site with no backend, so
   writes happen directly from the browser using anonymous auth.
   Leave ENABLE_FIREBASE = false to run with zero Firebase setup.
   ================================================================= */
const ENABLE_FIREBASE = true;

const firebaseConfig = {
  apiKey: "AIzaSyCCb7Tldn3z41RPwC_CPn3GMUDRcx1sGyA",
  authDomain: "flutterapps-2d8dd.firebaseapp.com",
  databaseURL: "https://flutterapps-2d8dd.firebaseio.com",
  projectId: "flutterapps-2d8dd",
  storageBucket: "flutterapps-2d8dd.firebasestorage.app",
  messagingSenderId: "286270483331",
  appId: "1:286270483331:web:b20bd0e7b4fafbbab6a4b6",
};

let fbDb = null;
let fbStorage = null;
const firebaseNoteEl = document.getElementById("firebaseNote");

if (ENABLE_FIREBASE) {
  try {
    firebase.initializeApp(firebaseConfig);
    fbDb = firebase.firestore();
    fbStorage = firebase.storage();
    firebase.auth().signInAnonymously().catch((e) => {
      console.warn("Anonymous sign-in failed — archiving disabled:", e.message);
      firebaseNoteEl.textContent =
        "Firebase archiving is off: enable Anonymous auth in your Firebase console to turn it on.";
    });
  } catch (e) {
    console.warn("Firebase init failed:", e.message);
  }
}

async function archiveToFirebase(fileName, blob, meta) {
  if (!fbDb || !fbStorage || !firebase.auth().currentUser) return;
  try {
    const ref = fbStorage.ref().child(`seating-plans/${fileName}`);
    await ref.put(blob);
    const url = await ref.getDownloadURL();
    await fbDb.collection("generatedSheets").add({
      fileName,
      url,
      ...meta,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
  } catch (e) {
    console.warn("Firebase archive skipped:", e.message);
  }
}

/* =================================================================
   SEAT PATTERN — snake / serpentine numbering in column-groups.
   col 0 (even): top -> bottom   1,2,3,4,5,6,7
   col 1 (odd):  bottom -> top   14,13,...,8
   col 2 (even): top -> bottom   15..21
   ================================================================= */
function seatNumberAt(row, col, rows) {
  const base = col * rows;
  return col % 2 === 0 ? base + row + 1 : base + (rows - row);
}

/* =================================================================
   STATE
   ================================================================= */
const FIELD_DEFS = [
  { key: "institution", label: "Institution Name" },
  { key: "examTitle", label: "Examination Title" },
  { key: "courseCode", label: "Course Code & Title" },
  { key: "branch", label: "Branch" },
  { key: "roomNo", label: "Room No" },
  { key: "date", label: "Date" },
  { key: "time", label: "Time" },
];

const state = {
  header: {
    institution: "SREENIDHI UNIVERSITY",
    examTitle: "I. B.Tech - II Semester End Examination - May/June 2026",
    courseCode: "25MAT1002 - Discrete Mathematics",
    branch: "CSE",
    roomNo: "1201",
    date: "23-05-2026",
    time: "09:30 AM to 12:30 PM",
  },
  students: [],
  tab: "roster",
};

/* =================================================================
   UI: header fields
   ================================================================= */
const fieldsEl = document.getElementById("fields");
FIELD_DEFS.forEach((f) => {
  const label = document.createElement("label");
  label.className = "field";
  label.innerHTML = `<span>${f.label}</span><input data-key="${f.key}" value="${state.header[f.key]}" />`;
  fieldsEl.appendChild(label);
});
fieldsEl.addEventListener("input", (e) => {
  const key = e.target.dataset.key;
  if (key) {
    state.header[key] = e.target.value;
    renderPreview();
  }
});

/* =================================================================
   FILE UPLOAD + DOCX PARSING (Mammoth)
   ================================================================= */
const dropzone = document.getElementById("dropzone");
const fileInput = document.getElementById("fileInput");
document.getElementById("chooseBtn").onclick = () => fileInput.click();

["dragover", "dragleave", "drop"].forEach((evt) =>
  dropzone.addEventListener(evt, (e) => {
    e.preventDefault();
    dropzone.classList.toggle("dragover", evt === "dragover");
  })
);
dropzone.addEventListener("drop", (e) => handleFile(e.dataTransfer.files[0]));
fileInput.addEventListener("change", (e) => handleFile(e.target.files[0]));

async function handleFile(file) {
  if (!file) return;
  const statusEl = document.getElementById("fileStatus");
  statusEl.textContent = "Reading…";
  statusEl.className = "status";
  try {
    const students = await parseRosterDocx(file);
    state.students = students;
    statusEl.textContent = `Imported ${students.length} students from "${file.name}".`;
    statusEl.className = "status ok";
    document.getElementById("studentCount").textContent = students.length;
    ["exportAttendance", "exportSeatingXlsx", "exportSeatingPdf"].forEach(
      (id) => (document.getElementById(id).disabled = false)
    );
    renderPreview();
  } catch (e) {
    statusEl.textContent = e.message || "Could not read this .docx file.";
    statusEl.className = "status err";
  }
}

async function parseRosterDocx(file) {
  const arrayBuffer = await file.arrayBuffer();
  const { value: html } = await mammoth.convertToHtml({ arrayBuffer });
  const doc = new DOMParser().parseFromString(html, "text/html");
  const table = doc.querySelector("table");
  if (!table) throw new Error("No table found in this document.");

  const rows = Array.from(table.querySelectorAll("tr")).map((tr) =>
    Array.from(tr.querySelectorAll("td,th")).map((td) => td.textContent.trim())
  );
  if (rows.length < 2) throw new Error("Table has no data rows.");

  const header = rows[0].map((h) => h.toLowerCase());
  const regIdx = header.findIndex((h) => h.includes("regist"));
  const nameIdx = header.findIndex((h) => h.includes("name"));
  if (regIdx === -1 || nameIdx === -1) {
    throw new Error("Couldn't find Register Number / Name columns in the table header.");
  }

  const students = [];
  rows.slice(1).forEach((cells) => {
    const register = (cells[regIdx] || "").trim();
    const name = (cells[nameIdx] || "").trim();
    if (!register && !name) return;
    students.push({ slNo: students.length + 1, register, name });
  });
  if (!students.length) throw new Error("No student rows detected — check the file format.");
  return students;
}

/* =================================================================
   TABS + PREVIEW
   ================================================================= */
document.getElementById("tabRoster").onclick = () => switchTab("roster");
document.getElementById("tabSeating").onclick = () => switchTab("seating");
document.getElementById("rowsPerCol").addEventListener("input", () => {
  if (state.tab === "seating") renderPreview();
});

function switchTab(tab) {
  state.tab = tab;
  document.getElementById("tabRoster").classList.toggle("active", tab === "roster");
  document.getElementById("tabSeating").classList.toggle("active", tab === "seating");
  renderPreview();
}

function getRowsPerCol() {
  return Math.max(1, Number(document.getElementById("rowsPerCol").value) || 7);
}

function renderPreview() {
  const body = document.getElementById("previewBody");
  const h = state.header;
  if (!state.students.length) {
    body.innerHTML = `<p class="empty">Upload an attendance .docx on the left to generate a preview.</p>`;
    return;
  }

  let html = `<div class="doc-title">${escapeHtml(h.institution)}</div><div class="doc-sub">${escapeHtml(h.examTitle)}</div>`;
  if (state.tab === "seating") html += `<div class="doc-sub">Room No : ${escapeHtml(h.roomNo)}</div>`;
  html += `<div class="doc-sub" style="font-size:12px;color:#6b6255;margin-top:6px;">Date: ${escapeHtml(h.date)}</div>`;

  if (state.tab === "roster") {
    html += `<p><b>Course Code &amp; Title:</b> ${escapeHtml(h.courseCode)}</p>`;
    html += `<p><b>Branch:</b> ${escapeHtml(h.branch)} &nbsp;&nbsp; <b>Time:</b> ${escapeHtml(h.time)}</p>`;
    html += `<table class="sheet"><thead><tr><th>Sl.No</th><th>Register Number</th><th>Name of the Student</th><th>Answer Booklet Sl.No</th><th>Signature</th></tr></thead><tbody>`;
    state.students.forEach((s) => {
      html += `<tr><td>${s.slNo}</td><td class="left">${escapeHtml(s.register)}</td><td class="left">${escapeHtml(s.name)}</td><td></td><td></td></tr>`;
    });
    html += `</tbody></table>`;
  } else {
    const rowsPerCol = getRowsPerCol();
    const cols = Math.max(1, Math.ceil(state.students.length / rowsPerCol));
    html += `<p><b>Course Code &amp; Title:</b> ${escapeHtml(h.courseCode)}</p>`;
    html += `<p><b>Branch:</b> ${escapeHtml(h.branch)} &nbsp;&nbsp; <b>Time:</b> ${escapeHtml(h.time)}</p>`;
    html += `<div class="doc-title" style="font-size:14px;margin:10px 0;">SEATING PLAN</div>`;
    html += `<table class="sheet"><thead><tr>`;
    for (let c = 0; c < cols; c++) html += `<th>Seat No</th><th>UR Number</th>`;
    html += `</tr></thead><tbody>`;
    for (let r = 0; r < rowsPerCol; r++) {
      html += "<tr>";
      for (let c = 0; c < cols; c++) {
        const seatNo = seatNumberAt(r, c, rowsPerCol);
        const inRange = seatNo <= state.students.length;
        const st = inRange ? state.students[seatNo - 1] : null;
        html += `<td>${inRange ? seatNo : ""}</td><td>${st ? escapeHtml(st.register) : ""}</td>`;
      }
      html += "</tr>";
    }
    html += `</tbody></table>`;
  }
  body.innerHTML = html;
}

function escapeHtml(str) {
  return String(str ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* =================================================================
   EXPORT: Attendance .xlsx (SheetJS)
   ================================================================= */
document.getElementById("exportAttendance").onclick = () => {
  const h = state.header;
  const title = [
    [h.institution],
    [h.examTitle],
    [`Course Code & Title : ${h.courseCode}`],
    [`Branch: ${h.branch}        Room No: ${h.roomNo}        Date: ${h.date}        Time: ${h.time}`],
    [],
    ["Sl.No", "Register Number", "Name of the Student", "Answer Booklet Serial Number", "Signature of Student"],
  ];
  const body = state.students.map((s) => [s.slNo, s.register, s.name, "", ""]);
  const ws = XLSX.utils.aoa_to_sheet([...title, ...body]);
  ws["!merges"] = [
    { s: { r: 0, c: 0 }, e: { r: 0, c: 4 } },
    { s: { r: 1, c: 0 }, e: { r: 1, c: 4 } },
    { s: { r: 2, c: 0 }, e: { r: 2, c: 4 } },
    { s: { r: 3, c: 0 }, e: { r: 3, c: 4 } },
  ];
  ws["!cols"] = [{ wch: 8 }, { wch: 22 }, { wch: 34 }, { wch: 26 }, { wch: 22 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Attendance Sheet");
  const fileName = `Attendance_${h.roomNo || "sheet"}.xlsx`;
  XLSX.writeFile(wb, fileName);

  const blob = new Blob([XLSX.write(wb, { bookType: "xlsx", type: "array" })], {
    type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
  });
  archiveToFirebase(fileName, blob, { type: "attendance", header: h });
};

/* =================================================================
   EXPORT: Seating Plan .xlsx (SheetJS)
   ================================================================= */
document.getElementById("exportSeatingXlsx").onclick = () => {
  const h = state.header;
  const rowsPerCol = getRowsPerCol();
  const cols = Math.max(1, Math.ceil(state.students.length / rowsPerCol));

  const headRow = [];
  for (let c = 0; c < cols; c++) headRow.push("Seat No", "UR Number");

  const title = [
    [h.institution],
    [h.examTitle],
    [`Room No : ${h.roomNo}`],
    [`Course Code & Title : ${h.courseCode}`],
    [`Branch: ${h.branch}        Time: ${h.time}        Date: ${h.date}`],
    ["SEATING PLAN"],
    [],
    headRow,
  ];

  const body = [];
  for (let r = 0; r < rowsPerCol; r++) {
    const line = [];
    for (let c = 0; c < cols; c++) {
      const seatNo = seatNumberAt(r, c, rowsPerCol);
      const st = state.students[seatNo - 1];
      if (seatNo <= state.students.length) line.push(seatNo, st ? st.register : "");
      else line.push("", "");
    }
    body.push(line);
  }

  const ws = XLSX.utils.aoa_to_sheet([...title, ...body]);
  const lastCol = headRow.length - 1;
  ws["!merges"] = [0, 1, 2, 3, 4, 5].map((r) => ({ s: { r, c: 0 }, e: { r, c: lastCol } }));
  ws["!cols"] = Array(headRow.length).fill({ wch: 14 });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Seating Plan");
  const fileName = `SeatingPlan_Room${h.roomNo || ""}.xlsx`;
  XLSX.writeFile(wb, fileName);

  const blob = new Blob([XLSX.write(wb, { bookType: "xlsx", type: "array" })], {
    type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
  });
  archiveToFirebase(fileName, blob, { type: "seating", header: h });
};

/* =================================================================
   EXPORT: Seating Plan .pdf (jsPDF + autotable)
   ================================================================= */
document.getElementById("exportSeatingPdf").onclick = () => {
  const h = state.header;
  const rowsPerCol = getRowsPerCol();
  const cols = Math.max(1, Math.ceil(state.students.length / rowsPerCol));

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: "landscape", unit: "pt", format: "a4" });
  const pageWidth = doc.internal.pageSize.getWidth();

  doc.setFont("helvetica", "bold");
  doc.setFontSize(16);
  doc.text(h.institution, pageWidth / 2, 40, { align: "center" });
  doc.setFontSize(13);
  doc.text(h.examTitle, pageWidth / 2, 58, { align: "center" });
  doc.setFontSize(11);
  doc.text(`Room No : ${h.roomNo}`, pageWidth / 2, 74, { align: "center" });

  doc.setFont("helvetica", "normal");
  doc.setFontSize(10);
  doc.text(`Course Code & Title : ${h.courseCode}`, 40, 96);
  doc.text(`Branch: ${h.branch}    Time: ${h.time}    Date: ${h.date}`, 40, 112);

  doc.setFont("helvetica", "bold");
  doc.setFontSize(12);
  doc.text("SEATING PLAN", pageWidth / 2, 132, { align: "center" });

  const head = [[]];
  for (let c = 0; c < cols; c++) head[0].push("Seat No", "UR Number");

  const body = [];
  for (let r = 0; r < rowsPerCol; r++) {
    const line = [];
    for (let c = 0; c < cols; c++) {
      const seatNo = seatNumberAt(r, c, rowsPerCol);
      const st = state.students[seatNo - 1];
      if (seatNo <= state.students.length) line.push(String(seatNo), st ? st.register : "");
      else line.push("", "");
    }
    body.push(line);
  }

  doc.autoTable({
    head,
    body,
    startY: 146,
    theme: "grid",
    styles: { fontSize: 8, halign: "center", cellPadding: 4 },
    headStyles: { fillColor: [239, 232, 216], textColor: [35, 31, 26] },
  });

  const fileName = `SeatingPlan_Room${h.roomNo || ""}.pdf`;
  doc.save(fileName);

  const blob = doc.output("blob");
  archiveToFirebase(fileName, blob, { type: "seating-pdf", header: h });
};

</script>
</body>
</html>
